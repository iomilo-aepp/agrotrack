<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgroTrack v0.7</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;margin:0;background:#f4f7f2;color:#17301f}.app{max-width:700px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:18px;margin:12px 0;border:1px solid #dfe7df}
input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ccd8cd;font-size:16px;box-sizing:border-box}button{background:#216b3a;color:white;font-weight:bold;border:0}.soft{background:#e8f3e8;color:#216b3a}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:#f7faf6;padding:12px;border-radius:12px}.m b{display:block;font-size:20px}small{color:#718078}h1{margin-bottom:2px}
</style></head><body><div class="app">
<div id="auth"><h1>🌱 AgroTrack</h1><small>v0.7 • Cloud</small><div class="card">
<h2 id="authTitle">Σύνδεση</h2><div id="nameBox" class="hidden"><input id="name" placeholder="Ονοματεπώνυμο"></div>
<input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Κωδικός (6+ χαρακτήρες)">
<button onclick="submitAuth()" id="authBtn">Σύνδεση</button><button class="soft" onclick="toggleAuth()" id="toggleBtn">Δεν έχω λογαριασμό — Εγγραφή</button>
<p id="msg"></p></div></div>

<div id="main" class="hidden"><h1>🌱 AgroTrack</h1><small id="who"></small><button class="soft" onclick="logout()">Έξοδος</button>
<div class="card"><h3>Καλλιεργητική περίοδος</h3><select id="season" onchange="loadGH()"></select><input id="newSeason" placeholder="π.χ. 2026–27"><button onclick="addSeason()">+ Περίοδος</button></div>
<div class="card"><h3>Αγροτεμάχιο / Θερμοκήπιο</h3><select id="gh" onchange="dash()"></select><input id="ghName" placeholder="Όνομα"><div class="grid"><input id="area" type="number" step=".1" placeholder="Στρέμματα"><select id="crop"><option>Αγγούρι</option><option>Ντομάτα</option><option>Πιπεριά</option><option>Μελιτζάνα</option><option>Κολοκύθι</option><option>Καρπούζι</option><option>Πεπόνι</option><option>Ελιά</option><option>Αμπέλι</option><option>Πατάτα</option><option>Αβοκάντο</option></select></div><button onclick="addGH()">+ Αγροτεμάχιο</button></div>
<div class="card"><div class="metrics"><div class="m">Παραγωγή<b id="kg">0 kg</b></div><div class="m">Έσοδα<b id="inc">0 €</b></div><div class="m">Έξοδα<b id="exp">0 €</b></div><div class="m">Αποτέλεσμα<b id="profit">0 €</b></div></div></div>
<div class="card"><h3>Νέα καταχώρηση</h3><select id="etype" onchange="entryFields()"><option value="expense">Έξοδο</option><option value="harvest">Συγκομιδή</option><option value="sale">Πώληση</option></select><div id="fields"></div><input id="note" placeholder="Σημείωση"><button onclick="addEntry()">Αποθήκευση</button></div>
</div></div>
<script>
const sb=supabase.createClient('https://yaoumcuvzvzrdcnmpmhv.supabase.co','sb_publishable_N9tUlIyCPO9wgPg42MsppQ__PRnSuax');let signup=false,user=null;
const euro=n=>new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR'}).format(n||0);
function toggleAuth(){signup=!signup;authTitle.textContent=signup?'Εγγραφή':'Σύνδεση';nameBox.classList.toggle('hidden',!signup);authBtn.textContent=signup?'Δημιουργία λογαριασμού':'Σύνδεση';toggleBtn.textContent=signup?'Έχω λογαριασμό — Σύνδεση':'Δεν έχω λογαριασμό — Εγγραφή'}
async function submitAuth(){msg.textContent='';let r=signup?await sb.auth.signUp({email:email.value,password:pass.value,options:{data:{full_name:name.value}}}):await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error)return msg.textContent=r.error.message;if(r.data.session)enter(r.data.user);else msg.textContent='Έλεγξε το email σου για επιβεβαίωση και μετά κάνε σύνδεση.'}
async function enter(u){user=u;auth.classList.add('hidden');main.classList.remove('hidden');who.textContent=u.user_metadata?.full_name||u.email;await loadSeasons();entryFields()}
async function logout(){await sb.auth.signOut();location.reload()}
async function loadSeasons(){let r=await sb.from('seasons').select('*').order('created_at');if(r.error)return alert(r.error.message);season.innerHTML=r.data.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');loadGH()}
async function addSeason(){if(!newSeason.value.trim())return;let r=await sb.from('seasons').insert({user_id:user.id,name:newSeason.value.trim()});if(r.error)return alert(r.error.message);newSeason.value='';loadSeasons()}
async function loadGH(){if(!season.value){gh.innerHTML='';return}let r=await sb.from('greenhouses').select('*').eq('season_id',season.value);if(r.error)return alert(r.error.message);gh.innerHTML=r.data.map(x=>`<option value="${x.id}">${x.name} • ${x.crop}</option>`).join('');dash()}
async function addGH(){if(!season.value)return alert('Φτιάξε πρώτα περίοδο.');let r=await sb.from('greenhouses').insert({user_id:user.id,season_id:+season.value,name:ghName.value,crop:crop.value,area:+area.value});if(r.error)return alert(r.error.message);ghName.value='';area.value='';loadGH()}
async function dash(){if(!gh.value)return;let [a,b,c]=await Promise.all([sb.from('expenses').select('*').eq('greenhouse_id',gh.value),sb.from('harvests').select('*').eq('greenhouse_id',gh.value),sb.from('sales').select('*').eq('greenhouse_id',gh.value)]);if(a.error||b.error||c.error)return alert((a.error||b.error||c.error).message);let e=a.data.reduce((s,x)=>s+ +x.amount,0),k=b.data.reduce((s,x)=>s+ +x.kg,0),i=c.data.reduce((s,x)=>s+(+x.kg*+x.price_per_kg),0);kg.textContent=k+' kg';inc.textContent=euro(i);exp.textContent=euro(e);profit.textContent=euro(i-e)}
function entryFields(){if(etype.value==='expense')fields.innerHTML='<input id="cat" placeholder="Κατηγορία π.χ. Λίπασμα"><input id="amount" type="number" step=".01" placeholder="Ποσό €">';if(etype.value==='harvest')fields.innerHTML='<input id="kgs" type="number" step=".01" placeholder="Κιλά">';if(etype.value==='sale')fields.innerHTML='<div class="grid"><input id="kgs" type="number" step=".01" placeholder="Κιλά"><input id="price" type="number" step=".01" placeholder="Τιμή/kg €"></div>'}
async function addEntry(){if(!gh.value)return alert('Φτιάξε πρώτα αγροτεμάχιο.');let today=new Date().toISOString().slice(0,10),r;if(etype.value==='expense')r=await sb.from('expenses').insert({user_id:user.id,greenhouse_id:+gh.value,expense_date:today,category:cat.value,amount:+amount.value,note:note.value});if(etype.value==='harvest')r=await sb.from('harvests').insert({user_id:user.id,greenhouse_id:+gh.value,harvest_date:today,kg:+kgs.value,note:note.value});if(etype.value==='sale')r=await sb.from('sales').insert({user_id:user.id,greenhouse_id:+gh.value,sale_date:today,kg:+kgs.value,price_per_kg:+price.value,note:note.value});if(r.error)return alert(r.error.message);note.value='';dash()}
(async()=>{let r=await sb.auth.getSession();if(r.data.session)enter(r.data.session.user)})();
</script></body></html>
