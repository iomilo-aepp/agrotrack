<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgroTrack v0.7</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;margin:0;background:#f4f7f2;color:#17301f}.app{max-width:700px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:18px;margin:12px 0;border:1px solid #dfe7df}
input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ccd8cd;font-size:16px;box-sizing:border-box}button{background:#216b3a;color:white;font-weight:bold;border:0}.soft{background:#e8f3e8;color:#216b3a}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:#f7faf6;padding:12px;border-radius:12px}.m b{display:block;font-size:20px}small{color:#718078}.entry{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0ed}.entry:last-child{border-bottom:0}.entryText{flex:1}.entryActions{display:flex;gap:5px}.entryActions button{width:auto;padding:7px 9px;margin:0}.danger{background:#f7eaea;color:#9c2f2f}.voice{background:#365f47}h1{margin-bottom:2px}
</style></head><body><div class="app">
<div id="auth"><h1>🌱 AgroTrack</h1><small>v0.7 • Cloud</small><div class="card">
<h2 id="authTitle">Σύνδεση</h2><div id="nameBox" class="hidden"><input id="name" placeholder="Ονοματεπώνυμο"></div>
<input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Κωδικός (6+ χαρακτήρες)">
<button onclick="submitAuth()" id="authBtn">Σύνδεση</button><button class="soft" onclick="toggleAuth()" id="toggleBtn">Δεν έχω λογαριασμό — Εγγραφή</button>
<p id="msg"></p></div></div>

<div id="main" class="hidden"><h1>🌱 AgroTrack</h1><small id="who"></small><button class="soft" onclick="logout()">Έξοδος</button>
<div class="card"><h3>Καλλιεργητική περίοδος</h3><select id="season" onchange="loadGH()"></select><input id="newSeason" placeholder="π.χ. 2026–27"><button onclick="addSeason()">+ Περίοδος</button></div>
<div class="card"><h3>Αγροτεμάχιο / Θερμοκήπιο</h3><select id="gh" onchange="dash()"></select><input id="ghName" placeholder="Όνομα"><div class="grid"><input id="area" type="number" step=".1" placeholder="Στρέμματα"><select id="crop"><option>Αγγούρι</option><option>Ντομάτα</option><option>Πιπεριά</option><option>Μελιτζάνα</option><option>Κολοκύθι</option><option>Καρπούζι</option><option>Πεπόνι</option><option>Ελιά</option><option>Αμπέλι</option><option>Πατάτα</option><option>Αβοκάντο</option></select></div><button onclick="addGH()">+ Αγροτεμάχιο</button></div>
<div class="card"><div class="metrics"><div class="m">Παραγωγή<b id="kg">0 kg</b></div><div class="m">Πωληθέντα<b id="sold">0 kg</b></div><div class="m">Έσοδα<b id="inc">0 €</b></div><div class="m">Έξοδα<b id="exp">0 €</b></div><div class="m">Αποτέλεσμα<b id="profit">0 €</b></div><div class="m">Κόστος/kg<b id="costkg">—</b></div></div></div>
<div class="card"><h3>Νέα καταχώρηση</h3>
<button class="voice" id="voiceBtn" onclick="startVoice()">🎙️ Φωνητική καταχώρηση</button>
<small id="voiceMsg"></small>
<select id="etype" onchange="entryFields()"><option value="expense">Έξοδο</option><option value="harvest">Συγκομιδή</option><option value="sale">Πώληση</option></select>
<div id="fields"></div><input id="note" placeholder="Σημείωση"><button id="saveEntryBtn" onclick="addEntry()">Αποθήκευση</button></div>
<div class="card"><h3>Πρόσφατες κινήσεις</h3><div id="history"><small>Δεν υπάρχουν κινήσεις.</small></div></div>
</div></div>
<script>
const sb=supabase.createClient('https://yaoumcvuzvzrdcnmpmhv.supabase.co','sb_publishable_N9tUlIyCPO9wgPg42MsppQ__PRnSuax');let signup=false,user=null;
const euro=n=>new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR'}).format(n||0);
function toggleAuth(){signup=!signup;authTitle.textContent=signup?'Εγγραφή':'Σύνδεση';nameBox.classList.toggle('hidden',!signup);authBtn.textContent=signup?'Δημιουργία λογαριασμού':'Σύνδεση';toggleBtn.textContent=signup?'Έχω λογαριασμό — Σύνδεση':'Δεν έχω λογαριασμό — Εγγραφή'}
async function submitAuth(){msg.textContent='';let r=signup?await sb.auth.signUp({email:email.value,password:pass.value,options:{data:{full_name:name.value}}}):await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error)return msg.textContent=r.error.message;if(r.data.session)enter(r.data.user);else msg.textContent='Έλεγξε το email σου για επιβεβαίωση και μετά κάνε σύνδεση.'}
async function enter(u){user=u;auth.classList.add('hidden');main.classList.remove('hidden');who.textContent=u.user_metadata?.full_name||u.email;await loadSeasons();entryFields()}
async function logout(){await sb.auth.signOut();location.reload()}
async function loadSeasons(){let r=await sb.from('seasons').select('*').order('created_at');if(r.error)return alert(r.error.message);season.innerHTML=r.data.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');loadGH()}
async function addSeason(){if(!newSeason.value.trim())return;let r=await sb.from('seasons').insert({user_id:user.id,name:newSeason.value.trim()});if(r.error)return alert(r.error.message);newSeason.value='';loadSeasons()}
async function loadGH(){if(!season.value){gh.innerHTML='';return}let r=await sb.from('greenhouses').select('*').eq('season_id',season.value);if(r.error)return alert(r.error.message);gh.innerHTML=r.data.map(x=>`<option value="${x.id}">${x.name} • ${x.crop}</option>`).join('');dash()}
async function addGH(){if(!season.value)return alert('Φτιάξε πρώτα περίοδο.');let r=await sb.from('greenhouses').insert({user_id:user.id,season_id:+season.value,name:ghName.value,crop:crop.value,area:+area.value});if(r.error)return alert(r.error.message);ghName.value='';area.value='';loadGH()}
async function dash(){if(!gh.value){history.innerHTML='<small>Δεν υπάρχουν κινήσεις.</small>';return}
let [a,b,c]=await Promise.all([sb.from('expenses').select('*').eq('greenhouse_id',gh.value),sb.from('harvests').select('*').eq('greenhouse_id',gh.value),sb.from('sales').select('*').eq('greenhouse_id',gh.value)]);
if(a.error||b.error||c.error)return alert((a.error||b.error||c.error).message);
let e=a.data.reduce((s,x)=>s+ +x.amount,0),k=b.data.reduce((s,x)=>s+ +x.kg,0),sk=c.data.reduce((s,x)=>s+ +x.kg,0),i=c.data.reduce((s,x)=>s+(+x.kg*+x.price_per_kg),0);
kg.textContent=k+' kg';sold.textContent=sk+' kg';inc.textContent=euro(i);exp.textContent=euro(e);profit.textContent=euro(i-e);costkg.textContent=k?euro(e/k):'—';
let rows=[
...a.data.map(x=>({type:'expense',id:x.id,date:x.expense_date,label:'💶 '+x.category+' — '+euro(x.amount),note:x.note||''})),
...b.data.map(x=>({type:'harvest',id:x.id,date:x.harvest_date,label:'📦 Συγκομιδή — '+x.kg+' kg',note:x.note||''})),
...c.data.map(x=>({type:'sale',id:x.id,date:x.sale_date,label:'💰 Πώληση — '+x.kg+' kg × '+euro(x.price_per_kg),note:x.note||''}))
].sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);
history.innerHTML=rows.length?rows.map(x=>`<div class="entry"><div class="entryText"><b>${x.label}</b><br><small>${x.date}${x.note?' • '+x.note:''}</small></div><div class="entryActions"><button class="soft" onclick="editEntry('${x.type}',${x.id})">✏️</button><button class="danger" onclick="deleteEntry('${x.type}',${x.id})">🗑️</button></div></div>`).join(''):'<small>Δεν υπάρχουν κινήσεις.</small>';
}
function entryFields(){if(etype.value==='expense')fields.innerHTML='<input id="cat" placeholder="Κατηγορία π.χ. Λίπασμα"><input id="amount" type="number" step=".01" placeholder="Ποσό €">';if(etype.value==='harvest')fields.innerHTML='<input id="kgs" type="number" step=".01" placeholder="Κιλά">';if(etype.value==='sale')fields.innerHTML='<div class="grid"><input id="kgs" type="number" step=".01" placeholder="Κιλά"><input id="price" type="number" step=".01" placeholder="Τιμή/kg €"></div>'}
let saving=false,editing=null;
async function addEntry(){
 if(!gh.value)return alert('Φτιάξε πρώτα αγροτεμάχιο.');
 if(saving)return;
 saving=true;saveEntryBtn.disabled=true;saveEntryBtn.textContent='Αποθήκευση...';
 try{
  let today=new Date().toISOString().slice(0,10),r,t=etype.value,table=t==='expense'?'expenses':t==='harvest'?'harvests':'sales';
  let payload={user_id:user.id,greenhouse_id:+gh.value,note:note.value};
  if(t==='expense')Object.assign(payload,{expense_date:today,category:cat.value,amount:+amount.value});
  if(t==='harvest')Object.assign(payload,{harvest_date:today,kg:+kgs.value});
  if(t==='sale')Object.assign(payload,{sale_date:today,kg:+kgs.value,price_per_kg:+price.value});
  r=editing?await sb.from(table).update(payload).eq('id',editing.id):await sb.from(table).insert(payload);
  if(r.error)return alert(r.error.message);
  editing=null;note.value='';entryFields();await dash();
 }finally{saving=false;saveEntryBtn.disabled=false;saveEntryBtn.textContent='Αποθήκευση'}
}
async function deleteEntry(type,id){
 if(!confirm('Να διαγραφεί αυτή η καταχώρηση;'))return;
 const table=type==='expense'?'expenses':type==='harvest'?'harvests':'sales';
 const r=await sb.from(table).delete().eq('id',id);
 if(r.error)return alert(r.error.message);dash();
}
async function editEntry(type,id){
 const table=type==='expense'?'expenses':type==='harvest'?'harvests':'sales';
 const r=await sb.from(table).select('*').eq('id',id).single();
 if(r.error)return alert(r.error.message);
 editing={type,id};etype.value=type;entryFields();note.value=r.data.note||'';
 if(type==='expense'){cat.value=r.data.category;amount.value=r.data.amount}
 if(type==='harvest')kgs.value=r.data.kg;
 if(type==='sale'){kgs.value=r.data.kg;price.value=r.data.price_per_kg}
 saveEntryBtn.textContent='Αποθήκευση αλλαγών';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function parseGreekNumber(s){return Number(String(s).replace(',','.'))}
function normalizeVoice(t){
 return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/€/g," ευρω ").replace(/\s+/g," ").trim();
}
function spokenPrice(t){
 // 1,20 / 1.20
 let m=t.match(/(\d+)[,.](\d+)/); if(m)return Number(m[1]+"."+m[2]);
 // "1 ευρώ και 20 λεπτά"
 m=t.match(/(\d+)\s*ευρω(?:\s+και)?\s*(\d+)\s*λεπτ/); if(m)return Number(m[1])+Number(m[2])/100;
 return null;
}
function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){voiceMsg.textContent='Η φωνητική αναγνώριση δεν υποστηρίζεται σε αυτόν τον browser.';return}
 const r=new SR();r.lang='el-GR';r.interimResults=false;voiceBtn.disabled=true;voiceMsg.textContent=' Ακούω...';
 r.onresult=e=>{
  const heard=e.results[0][0].transcript;
  const t=normalizeVoice(heard);
  voiceMsg.textContent=' Άκουσα: '+heard;

  const nums=[...t.matchAll(/\d+(?:[.,]\d+)?/g)].map(m=>parseGreekNumber(m[0]));
  const isHarvest=/μαζεψ|συγκομιδ|κοψα|παραγωγ/.test(t);
  const isSale=/πουλη|πωλησ|εφυγαν.*κιλα/.test(t);
  const expenseWords=/εβαλα|εδωσα|πληρω|αγορασ|ξοδεψ|εξοδο/.test(t);
  const expenseCategory=/λιπασ|φαρμακ|φυτοπροστα|εργατ|ρευμα|νερο|καυσιμ|πετρελ|σπορ|φυτ/.test(t);

  if(isSale){
    etype.value='sale';entryFields();
    let kgm=t.match(/(\d+(?:[.,]\d+)?)\s*(?:κιλα|kg)/);
    if(kgm)kgs.value=parseGreekNumber(kgm[1]); else if(nums[0]!=null)kgs.value=nums[0];
    let pr=spokenPrice(t);
    if(pr==null){
      let pm=t.match(/(?:με|τιμη|προς)\s*(\d+(?:[.,]\d+)?)/);
      if(pm)pr=parseGreekNumber(pm[1]);
      else if(nums.length>1)pr=nums[1];
    }
    if(pr!=null)price.value=pr.toFixed(2);
  } else if(isHarvest){
    etype.value='harvest';entryFields();
    let m=t.match(/(\d+(?:[.,]\d+)?)\s*(?:κιλα|kg)/);
    if(m)kgs.value=parseGreekNumber(m[1]); else if(nums[0]!=null)kgs.value=nums[0];
  } else if(expenseWords||expenseCategory){
    etype.value='expense';entryFields();
    let am=t.match(/(\d+(?:[.,]\d+)?)\s*(?:ευρω|€)/);
    if(am)amount.value=parseGreekNumber(am[1]); else if(nums[0]!=null)amount.value=nums[0];
    if(/λιπασ/.test(t))cat.value='Λίπασμα';
    else if(/εργατ/.test(t))cat.value='Εργατικά';
    else if(/ρευμα/.test(t))cat.value='Ρεύμα';
    else if(/νερο/.test(t))cat.value='Νερό';
    else if(/καυσιμ|πετρελ/.test(t))cat.value='Καύσιμα';
    else if(/φυτοπροστα|φαρμακ/.test(t))cat.value='Φυτοπροστασία';
  } else {
    voiceMsg.textContent+=' — Δεν κατάλαβα τον τύπο καταχώρησης.';
    return;
  }
  voiceMsg.textContent+=' — Έλεγξε τα πεδία και πάτησε Αποθήκευση.';
 };
 r.onerror=e=>voiceMsg.textContent=' Σφάλμα μικροφώνου: '+e.error;
 r.onend=()=>voiceBtn.disabled=false;r.start();
}
(async()=>{let r=await sb.auth.getSession();if(r.data.session)enter(r.data.session.user)})();
</script></body></html>
